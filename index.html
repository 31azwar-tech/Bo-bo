<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bo'Bo'</title>
<meta name="description" content="Quiet Knowledge, Deep Growth — ringkasan buku 8 bab, masing-masing satu menit.">
<meta name="theme-color" content="#263B53">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bo'Bo'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<script src="firebase-config.js"></script>
<style>
:root{
  --forest:#263B53;--forest-2:#1B2B3E;--cream:#F7FBFF;--gold:#FFE6A6;--gold-2:#3478C9;--sage:#FFF4D6;--blue:#3478C9;
  --bg:#F6F0E4;--surface:#FBF7EE;--card:#FFFDF8;--ink:#17261F;--ink-2:#4A5A52;--muted:#7C8A82;--line:#E4DCCB;--line-2:#EDE6D7;
  --accent:#3478C9;--on-accent:#FFFFFF;--chip:#E6F3FC;--bad:#A2412F;--ok:#2F6B4F;--warn:#9A6B12;
  --shadow:0 1px 2px rgba(23,38,31,.05),0 8px 24px -12px rgba(23,38,31,.18);
  --r:18px;--r-sm:12px;--serif:"Newsreader",Georgia,serif;--sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-read:1.18rem;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A15;--surface:#13221C;--card:#172A22;--ink:#EDE7DA;--ink-2:#C2C9C1;--muted:#8E9B93;--line:#24382F;--line-2:#1D3028;
  --accent:#FFE6A6;--on-accent:#10201A;--chip:#1E342A;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0E1A15;--surface:#13221C;--card:#172A22;--ink:#EDE7DA;--ink-2:#C2C9C1;--muted:#8E9B93;--line:#24382F;--line-2:#1D3028;
  --accent:#FFE6A6;--on-accent:#10201A;--chip:#1E342A;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.has-mini{padding-bottom:calc(148px + env(safe-area-inset-bottom,0px))}
body.auth{padding-bottom:0}
body.auth .appbar,body.auth .dock,body.auth .mini{display:none!important}
[hidden]{display:none!important}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.d{font-family:var(--serif);font-weight:500;letter-spacing:-.015em}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.86rem}
.label{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2)}
:root[data-theme="dark"] .label{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .label{color:var(--gold)}}

/* app bar */
.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.2) blur(14px);-webkit-backdrop-filter:saturate(1.2) blur(14px);
  padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid transparent;transition:border-color .2s}
.appbar.scrolled{border-bottom-color:var(--line)}
.appbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand img{width:34px;height:34px;border-radius:10px}
.brand b{font-weight:800;font-size:1.15rem;letter-spacing:-.02em;color:var(--ink)}
.sp{flex:1}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:0;background:transparent;color:var(--ink-2)}
.ib:hover{background:var(--chip)}
.ib svg{width:21px;height:21px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--forest);color:var(--cream);font-weight:700;border:0;position:relative;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.dot::after{content:"";position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--bg)}
.top-nav{display:none;gap:4px}
.top-nav button{border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--ink-2);font-size:.92rem}
.top-nav button[aria-current="page"]{color:var(--ink);background:var(--chip)}
@media (min-width:860px){.top-nav{display:flex}.dock{display:none!important}body{padding-bottom:40px}body.has-mini{padding-bottom:110px}}

main{max-width:1080px;margin:0 auto;padding:8px 16px 32px}
.view{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.dock button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.7rem;font-weight:600;color:var(--muted);border-radius:12px;position:relative}
.dock button svg{width:22px;height:22px}
.dock button[aria-current="page"]{color:var(--accent)}
.dock .badge{position:absolute;top:2px;left:calc(50% + 6px)}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#1b1407;font-size:.68rem;font-weight:800;display:inline-grid;place-items:center;padding:0 5px}

/* buttons, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 18px;border-radius:999px;font-weight:600;font-size:.93rem;transition:transform .12s,background .2s;white-space:nowrap}
.btn:hover{background:var(--chip)}.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08);background:var(--accent)}
.btn.gold{background:var(--gold);color:#1d1608;border-color:transparent}
.btn.sm{padding:7px 13px;font-size:.84rem}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.block{width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:.84rem;font-weight:600;color:var(--ink-2)}
.hint{font-size:.8rem;color:var(--muted)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
textarea{resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
.two{display:grid;gap:0 14px}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr}}
.panel{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);padding:18px;margin-bottom:14px}
.panel h3{font-size:1rem;margin-bottom:6px}
.notice{background:color-mix(in srgb,var(--gold) 14%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:var(--r-sm);padding:12px 14px;font-size:.9rem;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--chip);font-size:.76rem;font-weight:600;color:var(--ink-2);border:0}
.chip.on{background:var(--accent);color:var(--on-accent)}
.chip.st-pending{background:color-mix(in srgb,var(--gold) 22%,var(--card));color:var(--warn)}
.chip.st-processing{background:#E3ECF5;color:#2D5277}
.chip.st-done,.chip.st-approved,.chip.st-published{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}
.chip.st-rejected{background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad)}
.chip.st-draft{background:var(--chip);color:var(--muted)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}

/* headings */
.phead{padding:18px 0 16px}
.phead h1{font-size:clamp(1.9rem,4.6vw,2.6rem)}
.phead p{margin-top:8px;max-width:58ch;color:var(--ink-2)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.sec-h h2{font-size:1.35rem}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:.88rem;padding:4px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;background:var(--forest);color:var(--cream);padding:26px 22px;margin-top:6px}
.hero .label{color:var(--gold)}
.hero h1{font-size:clamp(1.7rem,4.2vw,2.4rem);margin:8px 0 6px;max-width:20ch}
.hero p{color:color-mix(in srgb,var(--cream) 78%,transparent);max-width:46ch}
.hero .stats{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap}
.hero .stats div{display:flex;flex-direction:column}
.hero .stats b{font-size:1.35rem;font-weight:700}
.hero .stats span{font-size:.76rem;color:color-mix(in srgb,var(--cream) 65%,transparent)}
.hero svg.orn{position:absolute;right:-30px;top:-30px;width:220px;height:220px;opacity:.13}
.continue{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);padding:12px;margin-top:14px;text-align:left;width:100%;box-shadow:var(--shadow)}
.continue .cv{width:72px;border-radius:8px;overflow:hidden}
.continue b{display:block;font-size:1rem}
.continue .bar{height:4px;background:var(--line-2);border-radius:4px;margin-top:8px;overflow:hidden}
.continue .bar i{display:block;height:100%;background:var(--blue)}
.playfab{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border:0;flex:none}
.playfab svg{width:20px;height:20px}

/* covers & grids */
.cover{position:relative;aspect-ratio:2/3;border-radius:6px 10px 10px 6px;overflow:hidden;background:var(--forest);box-shadow:0 1px 0 rgba(0,0,0,.05),0 10px 22px -12px rgba(38,59,83,.45)}
.cover svg,.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0 auto 0 0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.06) 60%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:22px 16px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
.bcard{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:9px}
.bcard b{font-size:.94rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bcard small{color:var(--muted);font-size:.8rem;display:block;margin-top:-6px}
.bcard .tag{position:absolute;top:8px;left:12px;z-index:2}
.bcard:hover .cover{transform:translateY(-3px)}.cover{transition:transform .25s}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(124px,150px);gap:16px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.rail::-webkit-scrollbar{display:none}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-family:var(--serif);font-weight:500;font-size:1.4rem;margin-bottom:6px}
.searchbox{position:relative;margin-bottom:12px}
.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.searchbox input{padding-left:40px;border-radius:999px}

/* book detail */
.bhead{display:grid;gap:22px;padding-top:12px}
@media (min-width:720px){.bhead{grid-template-columns:220px 1fr;align-items:end;gap:34px}}
.bhead .cover{width:min(200px,52vw);margin:0 auto}
@media (min-width:720px){.bhead .cover{width:100%}}
.bhead h1{font-size:clamp(1.8rem,4.5vw,2.7rem)}
.bhead .by{font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--ink-2);margin-top:6px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.syn{font-family:var(--serif);font-size:1.12rem;line-height:1.65;color:var(--ink-2);max-width:62ch}
.chlist{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.chlist li{border-bottom:1px solid var(--line)}
.chlist button.chrow{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:none;padding:14px 4px;text-align:left}
.chlist .no{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-weight:700;font-size:.85rem;color:var(--ink-2)}
.chlist .done .no{background:var(--blue);color:#fff}
.chlist b{font-weight:600}
.chlist small{display:block;color:var(--muted);font-size:.8rem}
.chlist .act svg{width:20px;height:20px;color:var(--muted)}
.chlist .playing .no{background:var(--gold);color:#1b1407}

/* reader */
.reader{max-width:680px;margin:0 auto}
.rtop{display:flex;align-items:center;gap:6px;padding:6px 0}
.rtop .t{flex:1;min-width:0;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 26px}
.dots i{width:22px;height:4px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--gold)}.dots i.seen{background:color-mix(in srgb,var(--forest) 55%,var(--line))}
.reader .kicker{text-align:center}
.reader h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,5vw,2.5rem);text-align:center;margin:10px 0 6px}
.reader .dur{text-align:center;color:var(--muted);font-size:.84rem;margin-bottom:28px}
.prose{font-family:var(--serif);font-size:var(--fs-read);line-height:1.75;color:var(--ink)}
.prose p{margin:0 0 1.05em}
.prose p:first-child::first-letter{font-size:3.1em;float:left;line-height:.9;padding:6px 8px 0 0;color:var(--forest);font-weight:500}
:root[data-theme="dark"] .prose p:first-child::first-letter{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .prose p:first-child::first-letter{color:var(--gold)}}
.points{background:#FFF4D6;border-radius:var(--r);padding:18px 20px;margin:26px 0;color:#263B53}
:root[data-theme="dark"] .points{background:#22364D;color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .points{background:#22364D;color:var(--ink)}}
.points h3{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.points ul{margin:0;padding-left:20px}.points li{margin:6px 0}
.rnav{display:flex;justify-content:space-between;gap:10px;margin:30px 0 10px;flex-wrap:wrap}
.markable::selection{background:color-mix(in srgb,var(--gold) 40%,transparent)}

/* mini player */
.mini{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:29;background:var(--forest);color:var(--cream);border-radius:18px;
  display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;padding:8px 8px 8px 10px;box-shadow:0 12px 30px -10px rgba(38,59,83,.45);max-width:720px;margin:0 auto;overflow:hidden}
@media (min-width:860px){.mini{bottom:18px}}
.mini .art{width:44px;height:44px;border-radius:10px;background:var(--gold);color:#1b1407;display:grid;place-items:center;font-weight:800}
.mini .tt{border:0;background:none;color:inherit;text-align:left;min-width:0;padding:0}
.mini .tt b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tt span{font-size:.76rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mini .ib{color:var(--cream)}.mini .ib:hover{background:rgba(255,255,255,.1)}
.mini .pp{background:var(--cream);color:var(--forest);border-radius:50%}
.mini .pp:hover{background:#fff}
.mini .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);transition:width .3s linear}

/* sheet (full player) */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.player{text-align:center}
.player .cover{width:min(190px,48vw);margin:6px auto 18px}
.player h2{font-family:var(--serif);font-weight:500;font-size:1.5rem}
.player .sub{color:var(--muted);font-size:.88rem;margin-top:4px}
.scrub{margin:20px 0 4px;width:100%;accent-color:var(--gold)}
.times{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctrls{display:flex;justify-content:center;align-items:center;gap:18px;margin:14px 0}
.ctrls .big{width:66px;height:66px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:0;display:grid;place-items:center}
.ctrls .big svg{width:28px;height:28px}
.ctrls .ib{width:48px;height:48px}
.src-note{font-size:.76rem;color:var(--muted)}

/* lists (admin, requests) */
.list{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 14px;flex-wrap:wrap}
.lrow .main{min-width:0;flex:1 1 220px}
.lrow .main b{display:block}
.lrow .main small{display:block;color:var(--muted);font-size:.8rem}
.lrow .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lrow select{width:auto;padding:6px 10px;font-size:.84rem}

/* chapter editor */
.ched{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;background:var(--surface)}
.ched header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ched header .no{width:30px;height:30px;border-radius:50%;background:var(--forest);color:var(--cream);display:grid;place-items:center;font-weight:700;font-size:.82rem;flex:none}
.ched .wc{font-size:.76rem;color:var(--muted);margin-left:auto}
.ched .wc.over{color:var(--bad)}.ched .wc.good{color:var(--ok)}
.audio-slot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;font-size:.84rem}
pre.prompt{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.8rem;max-height:260px;overflow:auto}
details summary{cursor:pointer;font-weight:600}
.drop{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;margin:12px 0;cursor:pointer;background:var(--surface)}
.drop svg{width:26px;height:26px;color:var(--gold-2)}
.drop small{display:block;color:var(--muted)}
.steps{list-style:none;padding:0;margin:10px 0 0;font-size:.86rem}

/* ================================================================ IndexedDB (cache buku & audio di perangkat) */
const Local = {
  idb: null,
  open() {
    return new Promise((res) => {
      let req; try { req = indexedDB.open("bobo", 1); } catch { res(); return; }
      req.onupgradeneeded = () => { const d = req.result; for (const [n, k] of [["books", "id"], ["files", "id"]]) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: k }); };
      req.onsuccess = () => { this.idb = req.result; res(); }; req.onerror = () => res(); req.onblocked = () => res();
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      if (!this.idb) { rej(new Error("Penyimpanan perangkat tidak tersedia.")); return; }
      const t = this.idb.transaction(store, mode); const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r ? r.result : undefined); t.onerror = () => rej(t.error);
    });
  },
  all(s) { return this.idb ? this.tx(s, "readonly", (o) => o.getAll()).then((r) => r || []) : Promise.resolve([]); },
  get(s, k) { return this.idb ? this.tx(s, "readonly", (o) => o.get(k)) : Promise.resolve(undefined); },
  put(s, v) { return this.idb ? this.tx(s, "readwrite", (o) => o.put(v)) : Promise.resolve(); },
  del(s, k) { return this.idb ? this.tx(s, "readwrite", (o) => o.delete(k)) : Promise.resolve(); },
};

const FB_VER = "10.14.1";

  get isAdmin() { if (DEMO) return true; const u = this.user; if (!u) return false; if (window.BOBO_ADMIN_UID) return u.uid === window.BOBO_ADMIN_UID; const e = String(u.email || "").toLowerCase(); return e === ADMIN_EMAIL && (u.emailVerified || u.providerData?.some((p) => p.providerId === "password")); },
  get approved() { return DEMO || this.isAdmin || this.member?.status === "approved"; },
  async load() {
    if (this.fb) return this.fb;
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [A0, A, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);

      const { A, auth } = await this.load();

      await new Promise((res) => { const un = A.onAuthStateChanged(auth, (u) => { this.user = u; un(); res(); }); });
      A.onAuthStateChanged(auth, (u) => { const was = this.user?.uid; this.user = u; if (u?.uid !== was) { this.stop(); if (u) this.start().then(render); else { this.member = null; render(); } } });
      if (this.user) await this.start();

    this.ready = true;
  },
  stop() { this.unsub.forEach((f) => { try { f(); } catch {} }); this.unsub = []; },
  async start() {
    const { F, db } = this.fb, u = this.user;
    if (this.isAdmin) { this.member = { status: "approved", admin: true }; await this.afterApproved(); this.watchAdmin(); return; }
    const ref = F.doc(db, "members", u.uid), mk = "member:" + u.uid;

    catch (e) { this.err = "Gagal mendaftar: " + (e.code || e.message); }
    await new Promise((res) => {
      let first = true; setTimeout(() => { if (first) { first = false; res(); } }, 5000);
      this.unsub.push(F.onSnapshot(ref, (s) => {
        const prev = this.member?.status; this.member = s.exists() ? s.data() : null; ls.set(mk, this.member ? { status: this.member.status } : null);
        if (first) { first = false; res(); }
        if (this.member?.status === "approved" && prev !== "approved") { this.afterApproved().then(() => { if (prev) { toast("Akunmu sudah disetujui. Selamat datang!"); render(); } }); }
        else if (prev && prev !== this.member?.status) render();
      }, (e) => { this.err = e.code === "permission-denied" ? "Akses ditolak Firestore. Pastikan firestore.rules sudah dideploy." : String(e.message || e); if (first) { first = false; res(); } }));
    });
    if (this.approved) await this.afterApproved();
  },
  _after: null,
  afterApproved() { if (!this._after) this._after = (async () => { await Lib.sync(); await Me.load(); })().finally(() => setTimeout(() => (this._after = null), 1000)); return this._after; },
  watchAdmin() {
    const { F, db } = this.fb;
    this.unsub.push(F.onSnapshot(F.query(F.collection(db, "members"), F.where("status", "==", "pending")), (s) => { this.pendingMembers = s.size; paintBadges(); }, () => {}));
    this.unsub.push(F.onSnapshot(F.query(F.collection(db, "requests"), F.where("status", "==", "pending")), (s) => { this.pendingReq = s.size; paintBadges(); }, () => {}));
  },
  async google() {
    const { A, auth } = await this.load(); const p = new A.GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
    if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) return A.signInWithRedirect(auth, p);
    try { await A.signInWithPopup(auth, p); } catch (e) { if (/popup/.test(e.code || "")) return A.signInWithRedirect(auth, p); throw e; }
  },
  async emailLogin(email, pass) { const { A, auth } = await this.load(); return A.signInWithEmailAndPassword(auth, email, pass); },
  async emailRegister(name, email, pass) { const { A, auth } = await this.load(); ls.set("regName", name); const c = await A.createUserWithEmailAndPassword(auth, email, pass); try { await A.updateProfile(c.user, { displayName: name }); } catch {} return c; },
  async reset(email) { const { A, auth } = await this.load(); return A.sendPasswordResetEmail(auth, email); },
  async signOut() { Player.stop(); this.stop(); if (this.fb) await this.fb.A.signOut(this.fb.auth); this.user = null; this.member = null; Me.reset(); },
};
function authMsg(e) {
  const c = e?.code || "";
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return "Email atau kata sandi salah.";
  if (/email-already-in-use/.test(c)) return "Email ini sudah terdaftar. Silakan masuk.";
  if (/weak-password/.test(c)) return "Kata sandi minimal 6 karakter.";
  if (/invalid-email/.test(c)) return "Format email tidak valid.";
  if (/too-many-requests/.test(c)) return "Terlalu banyak percobaan. Tunggu beberapa menit.";
  if (/unauthorized-domain/.test(c)) return "Domain ini belum diizinkan: Firebase > Authentication > Settings > Authorized domains.";
  if (/operation-not-allowed/.test(c)) return "Metode masuk ini belum diaktifkan di Firebase Authentication.";
  if (/popup-closed|cancelled-popup/.test(c)) return "Jendela masuk ditutup sebelum selesai.";
  if (/network/.test(c)) return "Tidak ada koneksi internet.";
  return e?.message || "Gagal masuk.";
}

/* ================================================================ PERPUSTAKAAN
   Firestore books/{id}: { title, author, category, status: draft|published, updatedAt, chapterCount, requestId, data: JSON buku lengkap }
   meta/library: { books: { id: updatedAt } } hanya buku terbit → anggota cukup 1 baca untuk tahu buku mana yang berubah. */
const Lib = {
  books: [],
  get visible() { return this.books.filter((b) => Cloud.isAdmin || b.pub === "published"); },
  get published() { return this.books.filter((b) => b.pub === "published"); },
  find(id) { return this.books.find((b) => b.id === id); },
  async loadLocal() { this.books = (await Local.all("books")).sort((a, z) => String(z.publishedAt || z.updatedAt || "").localeCompare(String(a.publishedAt || a.updatedAt || ""))); },
  pack(b) {
    const data = JSON.stringify(b);
    if (new Blob([data]).size > 900000) throw new Error("Buku terlalu besar (>900 KB). Kecilkan gambar sampul.");
    return { title: b.title || "", author: b.author || "", category: b.category || "", status: b.pub === "published" ? "published" : "draft", updatedAt: b.updatedAt, chapterCount: b.chapters.length, requestId: b.requestId || null, data };
  },
  unpack(id, doc) { try { const b = JSON.parse(doc.data); return { ...b, id, pub: doc.status, updatedAt: doc.updatedAt }; } catch { return null; } },
  async sync() {
    if (DEMO) { await this.loadLocal(); return; }
    const { F, db } = Cloud.fb;
    try {
      if (Cloud.isAdmin) {
        const remote = (await F.getDocs(F.collection(db, "books"))).docs.map((d) => this.unpack(d.id, d.data())).filter(Boolean);
        const local = await Local.all("books");
        for (const r of remote) await Local.put("books", r);
        for (const l of local) if (!remote.some((r) => r.id === l.id)) await Local.del("books", l.id);
      } else {
        const meta = await F.getDoc(F.doc(db, "meta", "library")); const map = meta.exists() ? meta.data().books || {} : {};
        const mine = ls.get("libMap", {});
        for (const [id, ts] of Object.entries(map)) {
          if (mine[id] === ts && (await Local.get("books", id))) continue;
          const s = await F.getDoc(F.doc(db, "books", id)); if (s.exists()) { const b = this.unpack(id, s.data()); if (b) await Local.put("books", b); }
        }
        for (const b of await Local.all("books")) if (!map[b.id]) await Local.del("books", b.id);
        ls.set("libMap", map);
      }
      ls.set("lastSync", now());
    } catch (e) { console.warn(e); Cloud.err = e.code === "permission-denied" ? "Ditolak Firestore: periksa Rules." : "Sinkron gagal (offline?)."; }
    await this.loadLocal();
  },
  async save(b) { // admin
    b.updatedAt = now(); b.chapterCount = b.chapters.length;
    if (!DEMO) { const { F, db } = Cloud.fb; const doc = this.pack(b); await F.setDoc(F.doc(db, "books", b.id), doc); await this.metaSet(b.id, doc.status === "published" ? doc.updatedAt : null); }
    await Local.put("books", b); await this.loadLocal(); return b;
  },
  async metaSet(id, ts) {
    const { F, db } = Cloud.fb; const ref = F.doc(db, "meta", "library");
    if (ts) await F.setDoc(ref, { books: { [id]: ts }, updatedAt: now() }, { merge: true });
    else { try { await F.updateDoc(ref, new F.FieldPath("books", id), F.deleteField()); } catch (e) { if (e.code !== "not-found") throw e; } }
  },
  async setPub(id, pub) {
    const b = this.find(id); if (!b) return; b.pub = pub; if (pub === "published" && !b.publishedAt) b.publishedAt = now();
    await this.save(b);
    if (pub === "published" && b.requestId) await Req.setStatus(b.requestId, "done", id).catch(() => {});
  },
  async remove(id) {
    const b = this.find(id); if (!b) return;
    for (const c of b.chapters) if (c.audio) await AudioStore.remove(b, c, true).catch(() => {});
    if (!DEMO) { const { F, db } = Cloud.fb; await F.deleteDoc(F.doc(db, "books", id)); await this.metaSet(id, null); }
    await Local.del("books", id); await this.loadLocal();
  },
};
const bookMinutes = (b) => b.chapters.reduce((s, c) => s + chMinutes(c), 0);
const chMinutes = (c) => (c.audio?.dur ? c.audio.dur / 60 : Math.max(0.5, words(c.text) / WPM));
const minLabel = (m) => (m < 1.5 ? "±1 menit" : `±${Math.round(m)} menit`);

/* ================================================================ DATA PRIBADI (1 dokumen: users/{uid}) */
const Me = {
  s: { marks: [], prog: {}, log: {}, prefs: {}, days: {} },
  key() { return "me:" + (Cloud.user?.uid || "local"); },
  reset() { this.s = { marks: [], prog: {}, log: {}, prefs: {} }; },
  async load() {
    this.s = { marks: [], prog: {}, log: {}, prefs: {}, ...ls.get(this.key(), {}) };
    if (DEMO || !Cloud.user) return;
    try {
      const { F, db } = Cloud.fb; const s = await F.getDoc(F.doc(db, "users", Cloud.user.uid));
      if (s.exists()) { const r = s.data(); if (String(r.updatedAt || "") >= String(this.s.updatedAt || "")) this.s = { marks: [], prog: {}, log: {}, prefs: {}, ...r }; }
    } catch (e) { console.warn(e); }
    Prefs.apply();
  },
  _t: null,
  save() {
    this.s.updatedAt = now(); ls.set(this.key(), this.s);
    if (DEMO || !Cloud.user) return;
    clearTimeout(this._t);
    this._t = setTimeout(() => { const { F, db } = Cloud.fb; const keep = Object.entries(this.s.log).sort().slice(-120); F.setDoc(F.doc(db, "users", Cloud.user.uid), JSON.parse(JSON.stringify({ ...this.s, log: Object.fromEntries(keep) }))).catch((e) => console.warn(e)); }, 2500);
  },
  prog(id) { return this.s.prog[id] || { ch: 0, done: [] }; },
  setProg(id, patch) { const p = { ...this.prog(id), ...patch, at: now() }; this.s.prog[id] = p; this.save(); },
  done(id, n) { const p = this.prog(id); if (!p.done.includes(n)) this.setProg(id, { done: [...p.done, n] }); const k = dayKey(); this.s.days = this.s.days || {}; const L = this.s.days[k] || []; if (!L.some((x) => x.b === id && x.n === n)) { this.s.days[k] = [...L, { b: id, n }]; const ks = Object.keys(this.s.days).sort(); while (ks.length > 60) delete this.s.days[ks.shift()]; this.save(); } },
  addSeconds(sec) { const k = dayKey(); this.s.log[k] = Math.round(((this.s.log[k] || 0) + sec) * 10) / 10; this.save(); paintGoalChip(); },
  streak() { let n = 0; const d = new Date(); if (!this.s.log[dayKey(d)]) d.setDate(d.getDate() - 1); while (this.s.log[dayKey(d)] >= 30) { n++; d.setDate(d.getDate() - 1); } return n; },
  isMarked(bookId, n) { return this.s.marks.some((m) => m.bookId === bookId && m.ch === n && !m.quote); },
  toggleMark(bookId, n) { const i = this.s.marks.findIndex((m) => m.bookId === bookId && m.ch === n && !m.quote); if (i >= 0) this.s.marks.splice(i, 1); else this.s.marks.unshift({ id: "m" + Date.now().toString(36), bookId, ch: n, at: now() }); this.save(); return i < 0; },
  addQuote(bookId, n, quote) { this.s.marks.unshift({ id: "q" + Date.now().toString(36), bookId, ch: n, quote: quote.slice(0, 600), at: now() }); this.save(); },
  delMark(id) { this.s.marks = this.s.marks.filter((m) => m.id !== id); this.save(); },
};
const Prefs = {
  get(k, d) { return Me.s.prefs?.[k] ?? ls.get(k, d); },
  set(k, v) { ls.set(k, v); Me.s.prefs = { ...(Me.s.prefs || {}), [k]: v }; Me.save(); this.apply(); },
  apply() {
    const t = this.get("theme", "auto"); if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
    document.documentElement.style.setProperty("--fs-read", this.get("fs", 1.18) + "rem");
    document.querySelector('meta[name="theme-color"]').content = isDark() ? "#0E1A15" : "#263B53";
  },
};
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };

/* ================================================================ AUDIO PER BAB (Firestore, dipotong 700 KB) */
const AudioStore = {
  PART: 700 * 1024,
  docId: (bookId, n, i) => `${bookId}__c${n}__${i}`.replace(/[\/#?\[\]]/g, "_"),
  cacheKey: (bookId, c) => `a:${bookId}/${c.n}@${c.audio?.at || ""}`,
  _url: {},
  async store(b, c, blob, meta) {
    const bytes = new Uint8Array(await blob.arrayBuffer()); const n = Math.ceil(bytes.length / this.PART), oldN = c.audio?.parts || 0;
    if (!DEMO) {
      const { F, db } = Cloud.fb;
      for (let i = 0; i < n; i++) await F.setDoc(F.doc(db, "audio", this.docId(b.id, c.n, i)), { bookId: b.id, ch: c.n, i, n, data: F.Bytes.fromUint8Array(bytes.subarray(i * this.PART, (i + 1) * this.PART)) });
      for (let i = n; i < oldN; i++) await F.deleteDoc(F.doc(db, "audio", this.docId(b.id, c.n, i))).catch(() => {});
    }
    if (c.audio) await Local.del("files", this.cacheKey(b.id, c)).catch(() => {});
    c.audio = { ...meta, parts: n, bytes: bytes.length, mime: blob.type || "audio/mpeg", at: now() };
    await Local.put("files", { id: this.cacheKey(b.id, c), blob }).catch(() => {});
  },
  async remove(b, c, skipSave) {
    if (!c.audio) return;
    if (!DEMO) { const { F, db } = Cloud.fb; for (let i = 0; i < c.audio.parts; i++) await F.deleteDoc(F.doc(db, "audio", this.docId(b.id, c.n, i))).catch(() => {}); }
    await Local.del("files", this.cacheKey(b.id, c)).catch(() => {});
    delete c.audio; if (!skipSave) await Lib.save(b);
  },
  async cached(b, c) { try { return !!(await Local.get("files", this.cacheKey(b.id, c))); } catch { return false; } },
  async url(b, c) {
    if (!c?.audio) return null; const k = this.cacheKey(b.id, c);

async function gemFetch(path, body) {
  const r = await fetch(GEM_BASE + path, { method: "POST", headers: { "content-type": "application/json", "x-goog-api-key": Keys.v.gemKey }, body: JSON.stringify(body) });
  if (!r.ok) {

    throw { code: "api_" + r.status, wait, daily: /per ?day|PerDay|daily/i.test(m), message: "Google AI Studio: " + (m || "HTTP " + r.status).slice(0, 220) };

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
/* Hanya TEKS BAB yang dikirim, tanpa instruksi gaya: instruksi ikut terbaca oleh model TTS. Karakter suara ditentukan pilihan suara. */
async function gemSpeak(text, voice, onWait) {
  const model = Keys.v.ttsModel || "gemini-3.8-flash-tts";
  for (let attempt = 0; ; attempt++) {
    try {
      const j = await gemFetch(`/models/${encodeURIComponent(model)}:generateContent`, { contents: [{ role: "user", parts: [{ text }] }],
        generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } } } });
      const d = j.candidates?.[0]?.content?.parts?.find((p) => p.inlineData)?.inlineData; if (!d) throw new Error("Google tidak mengirim audio.");
      return pcmFrom(b64ToBytes(d.data), d.mimeType || "");
    } catch (e) {
      if (e.code === "api_429" && !e.daily && attempt < 4) { // batas per menit: tunggu lalu ulangi otomatis
        const w = Math.ceil(e.wait || 30 * (attempt + 1)) + 2;
        for (let k = w; k > 0; k--) { onWait && onWait(k); await sleep(1000); if (TtsJob?.stop) throw new Error("Dihentikan."); }
        continue;
      }
      if (e.code === "api_429") throw new Error("Kuota harian Google AI Studio habis. Bab yang sudah jadi tersimpan; tekan \"Susun bab yang belum bernarasi\" besok untuk melanjutkan.");
      throw e;
    }
  }
}
async function pcmToMp3(pcm, rate) {

let TtsJob = null;
/* susun audio untuk bab-bab (idxs) buku b. save(): menyimpan buku setelah tiap bab */
async function studioRun(b, idxs, save, onStep) {
  await Keys.load(); if (!Keys.v.gemKey) throw new Error("Isi API key Gemini (Google AI Studio) dulu di Admin → AI.");
  if (TtsJob) throw new Error("Masih ada proses suara yang berjalan.");
  TtsJob = { stop: false }; let ok = 0;
  try {
    for (const i of idxs) {
      if (TtsJob.stop) break; const c = b.chapters[i]; if (!c?.text?.trim()) continue;
      onStep(`Bab ${c.n}: Google AI Studio menyuarakan…`, ok, idxs.length);
      const { pcm, rate } = await gemSpeak(narration(c), ttsVoice(), (k) => onStep(`Bab ${c.n}: batas per menit Google tercapai, lanjut otomatis dalam ${k} detik…`, ok, idxs.length));
      const expect = words(narration(c)) / (WPM / 60);
      if (pcm.length / rate < expect * 0.45) onStep(`Bab ${c.n}: audio hanya ${fmtTime(pcm.length / rate)}, lebih pendek dari teks. Periksa setelah selesai.`, ok, idxs.length);
      onStep(`Bab ${c.n}: mengompres & menyimpan…`, ok, idxs.length);
      await AudioStore.store(b, c, await pcmToMp3(pcm, rate), { dur: pcm.length / rate, src: "gemini-tts", voice: ttsVoice() });
      await save(); ok++;
    }
  } finally { const stopped = TtsJob?.stop; TtsJob = null; onStep(stopped ? `Dihentikan. ${ok} bab selesai.` : `Selesai: ${ok} bab bernarasi.`, ok, idxs.length, true); }
  return ok;
}

  if (d.copyPrompt !== undefined) { copyText(summaryPrompt(Draft?.title || "[JUDUL]", Draft?.author || "[PENULIS]")); return; }
  if (d.coverFind !== undefined) { findCover(); return; }
  if (d.coverClear !== undefined) { Draft.cover = ""; viewEdit(); return; }
  if (d.imp !== undefined) { t.disabled = true; try { await importSave(+d.imp, d.p); } catch (err) { toast("Gagal: " + (err.message || err)); t.disabled = false; } return; }
  if (d.impEdit !== undefined) { importSave(+d.impEdit, "draft", true); return; }
});
document.addEventListener("change", async (e) => {
  if (/^tsV/.test(e.target.id)) { ls.set("ttsVoice", e.target.value); return; }
  if (/^tsS/.test(e.target.id)) { ls.set("ttsStyle", e.target.value); return; }
  const s = e.target.closest("[data-req-status]"); if (!s) return;
  try { await Req.setStatus(s.dataset.reqStatus, s.value); toast("Status: " + REQ_ST[s.value]); } catch (err) { toast("Gagal: " + (err.code || err.message)); }
});
document.addEventListener("input", (e) => { if (e.target.matches("[data-scrub]")) { e.target._drag = true; Player.seekFrac(+e.target.value / 1000); setTimeout(() => (e.target._drag = false), 300); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); if (e.key === " " && Player.book && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); Player.toggle(); } });
addEventListener("scroll", () => $("#appbar").classList.toggle("scrolled", scrollY > 4), { passive: true });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => Prefs.apply());
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

/* ================================================================ BOOT */
(async () => {
  Prefs.apply(); Player.init();
  if (DEMO) $("#demoBanner").hidden = false;
  await Local.open(); await Lib.loadLocal();
  await Cloud.init();
  if (DEMO || !Cloud.user) await Me.load();
  render();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  addEventListener("online", () => { if (Cloud.user && Cloud.approved) Lib.sync().then(() => { if (["home", "library"].includes(route.name)) render(); }); });
})();
})();
</script>
